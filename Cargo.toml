# EntropyFS — single crate, one package, one architectural source tree.
#
# This package is intentionally NOT a workspace and intentionally has no
# subsystem crates.  Architecture is expressed with modules, visibility and
# dependency direction inside this single crate (see docs/architecture/overview.md
# and docs/adr/0001-single-crate.md).

[package]
name = "entropyfs"
version = "0.7.15"
edition = "2024"
rust-version = "1.87"
description = "Entropy-native Linux filesystem: persist irreducible state, materialize structure, preserve exact bytes."
license = "MIT OR Apache-2.0"
keywords = ["filesystem", "fuse", "entropy", "storage", "rans"]
categories = ["filesystem", "compression"]
readme = "README.md"
repository = "https://github.com/infinityabundance/entropyfs"

[lib]
name = "entropyfs"
path = "src/lib.rs"
# Phase 12E.14: the C ABI (src/ffi) needs a linkable artifact — rlib for
# Rust consumers, cdylib for the C smoke test and the Go binding (12E.15).
# The exported symbols are the narrow opaque-handle facade only.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "entropyfs"
path = "src/main.rs"

# Phase 12E.2: optional frontend/transport features. The BASE library (no
# default features) is the embeddable storage engine: the store, the
# representation machinery, the Engine facade, fsck, GC — with NO FUSE,
# NO ublk, and the reference SyncIo transport only. The default build
# keeps every frontend (the full daemon). No feature combination may
# silently change on-disk semantics: features gate CODE (frontends and
# transports), never the persistent format.
[features]
default = ["fuse", "ublk", "uring", "tracing"]

# The FUSE/VFS frontend (`src/fuse`, `entropyfs mount/unmount`).
fuse = ["dep:fuser", "dep:ctrlc"]

# The experimental ublk block-device frontend (`src/ublk`, `entropyfs
# ublk`; requires root + CONFIG_BLK_DEV_UBLK to RUN — the BlockStore
# adapter itself is kernel-free).
ublk = ["dep:libublk", "dep:smol", "dep:ctrlc"]

# The io_uring storage transport (`UringIo`; `SyncIo` remains the
# crash-consistency oracle and the default regardless).
uring = ["dep:io-uring"]

# Phase 12E.7: structured tracing spans on the externally important
# operations (engine put/get/range/sync/compact, store open/create,
# durability barrier, epoch checkpoint, GC). Default-ON (the daemon
# build); without a subscriber the spans are no-ops. Embedders building
# the base library with --no-default-features drop them entirely.
tracing = ["dep:tracing"]

[dependencies]
# --- Entropy / representation backends (external dependencies, not EntropyFS subsystems) ---
# ryg-rans-rs: public facade over the ryg_rans reconstruction (byte/64-bit/word rANS,
# model construction, malformed-input validation).  Exact scalar authority path.
ryg-rans-rs = { version = "=0.5.1", features = ["alloc"] }
# dsfb: drift–slew fusion bootstrap observer core (phi/omega/alpha + trust weighting).
# EntropyFS adapts it into a storage observer with ZERO decoding authority.
dsfb = "=0.1.2"

# --- Integrity / content identity ---
blake3 = "=1.8.7"   # logical content hashing (256-bit content IDs)
crc32c = "=0.6.8"   # physical record integrity (SSE4.2 crc32c w/ software fallback)

# --- Linux / FUSE frontend ---
fuser = { version = "=0.18.0", optional = true } # stable synchronous FUSE binding (pure Rust; no libfuse required)
rustix = { version = "1", features = ["fs", "param", "std", "time"] } # safe syscall wrappers (fs: flock/statvfs; io::pread/pwrite for the segment fd cache; param: page_size; time: the 11D oracle's thread-CPU clock)
# io_uring storage transport (Phase 10F, ADR-0021): the UringIo backend.
# Already a transitive dependency of libublk, so this adds no new crate to
# the tree. Safe API surface; the only unsafe in the crate is confined to
# store/io/uring.rs (SQE submission). Phase 12E.2: optional (feature `uring`).
io-uring = { version = "=0.7.14", optional = true }

# Phase 12E.7: structured tracing (optional; default-on via the
# `tracing` feature). Spans on externally important operations only —
# never user payload bytes, never per-chunk hot loops; no-op without a
# subscriber.
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }

# --- CLI / diagnostics ---
clap = { version = "4", features = ["derive"] }
# serde/serde_json are for HUMAN-READABLE JSON evidence and diagnostics ONLY.
# The permanent on-disk format is explicit little-endian byte codecs (src/format),
# never serde/bincode-derived layouts.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ctrl-C handling for the mount daemon (small, standard; no tokio).
ctrlc = { version = "3", optional = true }
# Isolated scratch stores for benchmarks and tests (never the host filesystem).
tempfile = "3"
# Experimental ublk block-device frontend control plane (Phase 7, ADR-0020).
# Requires root + CONFIG_BLK_DEV_UBLK to run; the BlockStore adapter itself
# needs no kernel support. Phase 12E.2: optional (feature `ublk`).
libublk = { version = "=0.4.7", optional = true }
smol = { version = "1", optional = true }
log = "0.4"

[dev-dependencies]
proptest = "1"  # property tests: rank/unrank round trips, materialization, store invariants
# Phase 12E.4: sha2 (test-only) reproduces the golden-store driver's
# `sha256sum` store-dir hash computation (tools/make-golden-fixtures.sh
# runs in the shell, where blake3sum is not guaranteed to exist). The
# golden court verifies fixture immutability against that shell hash.
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
debug = true

[profile.bench]
lto = "thin"
codegen-units = 1

# No `[workspace]` table: per ADR-0001 this package is deliberately not a
# workspace and declares no workspace root (cargo treats a standalone package
# as its own implicit workspace root for command resolution).
